								d="M36.5,-1184.5C36.5,-1184.5 161.5,-1184.5 161.5,-1184.5 167.5,-1184.5 173.5,-1190.5 173.5,-1196.5 173.5,-1196.5 173.5,-1291.5 173.5,-1291.5 173.5,-1297.5 167.5,-1303.5 161.5,-1303.5 161.5,-1303.5 36.5,-1303.5 36.5,-1303.5 30.5,-1303.5 24.5,-1297.5 24.5,-1291.5 24.5,-1291.5 24.5,-1196.5 24.5,-1196.5 24.5,-1190.5 30.5,-1184.5 36.5,-1184.5"
							/>
						</g>
					</g>
				</svg>
			</div>
		</div>

		<script>
			let scale = 1;
			const canvas = document.getElementById('canvas');
			const stage = document.getElementById('stage');
			const zoomLabel = document.getElementById('zoomLabel');

			function applyZoom() {
				canvas.style.transform = `scale(${scale})`;
				zoomLabel.textContent = Math.round(scale * 100) + '%';
			}
			document.getElementById('zoomIn').addEventListener('click', () => {
				scale = Math.min(scale + 0.15, 3);
				applyZoom();
			});
			document.getElementById('zoomOut').addEventListener('click', () => {
				scale = Math.max(scale - 0.15, 0.3);
				applyZoom();
			});
			document.getElementById('zoomFit').addEventListener('click', () => {
				const svg = canvas.querySelector('svg');
				if (!svg) return;
				const svgWidth = svg.viewBox.baseVal.width || svg.width.baseVal.value;
				const availableWidth = stage.clientWidth - 80;
				scale = Math.max(0.3, Math.min(availableWidth / svgWidth, 2));
				applyZoom();
				stage.scrollLeft = 0;
				stage.scrollTop = 0;
			});

			let isDown = false,
				startX,
				startY,
				scrollLeft,
				scrollTop;
			stage.addEventListener('mousedown', (e) => {
				isDown = true;
				stage.classList.add('dragging');
				startX = e.pageX - stage.offsetLeft;
				startY = e.pageY - stage.offsetTop;
				scrollLeft = stage.scrollLeft;
				scrollTop = stage.scrollTop;
			});
			window.addEventListener('mouseup', () => {
				isDown = false;
				stage.classList.remove('dragging');
			});
			stage.addEventListener('mousemove', (e) => {
				if (!isDown) return;
				e.preventDefault();
				const x = e.pageX - stage.offsetLeft;
				const y = e.pageY - stage.offsetTop;
				stage.scrollLeft = scrollLeft - (x - startX);
				stage.scrollTop = scrollTop - (y - startY);
			});

			stage.addEventListener(
				'wheel',
				(e) => {
					if (!e.ctrlKey && !e.metaKey) return;
					e.preventDefault();
					scale = Math.max(0.3, Math.min(scale - e.deltaY * 0.001, 3));
					applyZoom();
				},
				{ passive: false }
			);

			window.addEventListener('load', () => {
				document.getElementById('zoomFit').click();
			});
		</script>
	</body>
</html>
